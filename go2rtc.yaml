# go2rtc.yaml - Middleware de Vídeo do WebGuardião

# ---------------------------------------------------------
# 1. SERVIÇOS (As portas que o Gateway vai expor)
# ---------------------------------------------------------
api:
  listen: "0.0.0.0:1984" # 🚀 Habilita a Web UI e a API REST (ESSENCIAL para o orquestrador Python)
  origin: "*"
rtsp:
  listen: ":8554" # Porta para streams RTSP limpos (WebGuardião e VMS/DVR/iVMS)

webrtc:
  listen: ":8555" # Porta para transmissão de ultra baixa latência (monitoramento do operador)


# ---------------------------------------------------------
# 2. STREAMS (As suas fontes de ingestão de vídeo)
# ---------------------------------------------------------
streams:
  
  # A. Emulação de Arquivo (Seu vídeo de teste rodando em loop infinito simulando câmera)
  cam_teste_emulacao: exec:ffmpeg -re -stream_loop -1 -i video_teste.mp4 -c copy -f rtsp rtsp://localhost:8554/cam_teste_emulacao
  
  # B. Câmera Física via RTSP Direto (Padrão clássico, informando o canal e porta na mão)
  cam_hospital_01: rtsp://admin:senha@192.168.1.100:554/Streaming/Channels/101
  
  # C. Câmera Física via ONVIF (Padrão moderno, o go2rtc descobre o canal e a URL RTSP sozinho)
  # Descomente a linha abaixo e coloque o IP real quando for testar na rede do hospital
  # cam_intelbras_01: onvif://admin:senha@192.168.1.100
